apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudforge-ingress
  namespace: cloudforge
spec:
  ingressClassName: nginx
  rules:
    - host: cloudforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudforge-service
                port:
                  number: 80
