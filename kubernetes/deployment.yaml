apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-app
  namespace: cloudforge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: cloudforge
  template:
    metadata:
      labels:
        app: cloudforge
    spec:
      containers:
        - name: cloudforge-app
          image: cloudforge-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
