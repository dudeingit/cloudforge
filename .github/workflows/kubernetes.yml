name: CloudForge Kubernetes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            ghcr.io/yannh/kubeconform:latest \
            -strict -summary /work/kubernetes/
