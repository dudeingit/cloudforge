name: CloudForge Kubernetes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes manifests
        run: |
            kubectl create --dry-run=client -f kubernetes/namespace.yaml -o yaml > /dev/null
           kubectl create --dry-run=client -f kubernetes/deployment.yaml -o yaml > /dev/null
          kubectl create --dry-run=client -f kubernetes/service.yaml -o yaml > /dev/null
          kubectl create --dry-run=client -f kubernetes/ingress.yaml -o yaml > /dev/null
# Kubernetes CI enabled
