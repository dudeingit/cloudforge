name: CloudForge Kubernetes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        uses: stefanprodan/kube-tools@master
        with:
          kubectl: "latest"
          kubeconform: "latest"
          command: |
            kubeconform -strict -summary kubernetes/*.yaml
