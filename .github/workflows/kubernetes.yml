name: CloudForge Kubernetes CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: "-strict -summary kubernetes/*.yaml"
# Kubernetes CI enabled
